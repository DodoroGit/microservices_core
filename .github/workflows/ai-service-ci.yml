name: AI Service CI

on:
  push:
    branches: [main]
    paths:
      - 'services/ai-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/ai-service/**'

jobs:
  lint:
    name: Lint (ai-service)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .
