name: AI Service CI

on:
  push:
    branches: [main]
    paths:
      - 'services/ai-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/ai-service/**'

jobs:
  lint:
    name: Lint (ai-service)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  unit-test:
    name: Unit Tests (ai-service)
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: services/ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v -m "not integration"

  integration-test:
    name: Integration Tests (ai-service + Redis)
    runs-on: ubuntu-latest
    needs: unit-test

    defaults:
      run:
        working-directory: services/ai-service

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: pytest -v -m integration
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
