name: Note Service CI

on:
  push:
    branches: [main]
    paths:
      - 'services/note-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/note-service/**'

jobs:
  lint:
    name: Lint (note-service)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/note-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/note-service

  unit-test:
    name: Unit Tests (note-service)
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: services/note-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run unit tests
        run: go test ./...

  integration-test:
    name: Integration Tests (note-service + MongoDB)
    runs-on: ubuntu-latest
    needs: unit-test

    defaults:
      run:
        working-directory: services/note-service

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run integration tests
        run: go test ./repository/... -tags integration -v
        env:
          MONGODB_URL: mongodb://admin:admin123@localhost:27017
