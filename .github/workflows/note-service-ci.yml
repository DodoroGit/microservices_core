name: Note Service CI

on:
  push:
    branches: [main]
    paths:
      - 'services/note-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/note-service/**'

jobs:
  lint:
    name: Lint (note-service)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/note-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  unit-test:
    name: Unit Tests (note-service)
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: services/note-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v -m "not integration"

  integration-test:
    name: Integration Tests (note-service + MongoDB)
    runs-on: ubuntu-latest
    needs: unit-test

    defaults:
      run:
        working-directory: services/note-service

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: pytest -v -m integration
        env:
          MONGODB_URL: mongodb://admin:admin123@localhost:27017
          MONGODB_DB: test_notedb
